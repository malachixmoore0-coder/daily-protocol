name: Deploy push server

# Deploys push/ (the reminder server) to Cloudflare Workers.
# One-time setup: add two repository secrets under
# Settings -> Secrets and variables -> Actions:
#   CLOUDFLARE_API_TOKEN   (Cloudflare "Edit Cloudflare Workers" API token)
#   CLOUDFLARE_ACCOUNT_ID  (shown on the Cloudflare dashboard)

on:
  push:
    branches: [main]
    paths:
      - 'push/**'
      - '.github/workflows/push-worker.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for Cloudflare secrets
        id: cf
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$ACCOUNT" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Skipping deploy: add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.cf.outputs.ready == 'true'
        with:
          node-version: 20

      - name: Deploy Worker
        if: steps.cf.outputs.ready == 'true'
        working-directory: push
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.146.0 deploy
