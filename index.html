<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Daily Protocol</title>
<meta name="theme-color" content="#0b1610">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Protocol">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<style>
/* home-screen app: clear the status bar and stop rubber-band bounce */
html{background:#0b1610}
body{-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
.shell{padding-top:calc(14px + env(safe-area-inset-top,0px))!important}
</style>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&family=Tilt+Neon&family=JetBrains+Mono:wght@400;600&family=Chakra+Petch:wght@400;600;700&family=Syne:wght@500;700;800&family=Instrument+Serif:ital@0;1&family=Outfit:wght@300;400;600&display=swap">
<style>
/* Layout: a single-column phone app (max 480px) with a fixed bottom tab bar; four pages; one skin token set drives everything. */
:root{
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --f-body:"Outfit","Helvetica Neue",Arial,sans-serif;
  --page:#05040a;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--page);margin:0}
.app{min-height:100vh;background:var(--s-bg);color:var(--s-fg);font-family:var(--s-body);font-size:14px;line-height:1.45;position:relative;transition:background 1s}
.skin-neon{--s-bg:radial-gradient(120% 50% at 50% 0%,#2a0b3d 0%,#0a0612 55%,#05040a 100%) fixed;--s-fg:#f6e9ff;--s-dim:#b9a3cc;--s-a1:#ff4fd8;--s-a2:#00e5ff;--s-panel:#14061fcc;--s-solid:#14061f;--s-border:#ff4fd855;--s-track:#ffffff17;
  --s-display:"Tilt Neon",var(--f-body);--s-dw:400;--s-body:var(--f-mono);--s-r:14px;--s-glow:0 0 12px #ff4fd8aa;--s-tglow:0 0 10px #ff4fd8,0 0 26px #ff4fd8;--s-on:#05040a}
.skin-quest{--s-bg:radial-gradient(90% 50% at 50% 100%,#0b2a66 0%,#040915 60%,#02040a 100%) fixed;--s-fg:#d8ecff;--s-dim:#86a3c4;--s-a1:#4fb3ff;--s-a2:#9fd6ff;--s-panel:#0a1c3acc;--s-solid:#0a1c3a;--s-border:#4fb3ff;--s-track:#4fb3ff26;
  --s-display:"Chakra Petch",var(--f-body);--s-dw:700;--s-body:"Chakra Petch",var(--f-body);--s-r:3px;--s-glow:0 0 16px #2f8cff66;--s-tglow:0 0 12px #4fb3ff;--s-on:#02040a}
.skin-chrome{--s-bg:radial-gradient(80% 40% at 30% 0%,#3a3550 0%,#121218 50%,#07070a 100%) fixed;--s-fg:#eef0f4;--s-dim:#aab3c7;--s-a1:#ffb8e8;--s-a2:#b8c6ff;--s-panel:linear-gradient(160deg,#ffffff1f,#ffffff08);--s-solid:#18181f;--s-border:#ffffff2a;--s-track:#ffffff1a;
  --s-display:"Syne",var(--f-body);--s-dw:800;--s-body:var(--f-body);--s-r:20px;--s-glow:none;--s-tglow:none;--s-on:#111}
.skin-gridiron{--s-bg:radial-gradient(110% 40% at 50% -8%,#2d4d39 0%,#14281d 42%,#0b1610 100%) fixed,repeating-linear-gradient(90deg,#ffffff06 0 56px,#0000 56px 112px) fixed,#0b1610;--s-fg:#f1f4ef;--s-dim:#9fb5a7;--s-a1:#f2b632;--s-a2:#e8eee9;--s-panel:#13261bd9;--s-solid:#102018;--s-border:#ffffff1f;--s-track:#ffffff17;
  --s-display:"Barlow Condensed","Arial Narrow",var(--f-body);--s-dw:700;--s-body:"Barlow",var(--f-body);--s-r:10px;--s-glow:none;--s-tglow:none;--s-on:#141414}
.skin-gridiron .disp{text-transform:uppercase;letter-spacing:.01em}
.skin-gridiron .eb{color:var(--s-a1)}
.skin-gridiron .pnl{backdrop-filter:none}
.skin-solar{--s-bg:#2f7fd8;--s-fg:#fff;--s-dim:#ffffffc2;--s-a1:#ffd27a;--s-a2:#ffffff;--s-panel:#00000033;--s-solid:#1e2a55;--s-border:#ffffff2e;--s-track:#ffffff2e;
  --s-display:"Instrument Serif",Georgia,serif;--s-dw:400;--s-body:var(--f-body);--s-r:22px;--s-glow:none;--s-tglow:0 1px 10px #0000004d;--s-on:#1b1d4f}
.skin-solar .page{text-shadow:0 1px 8px #00000040}

canvas.fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.shell{position:relative;z-index:1;max-width:480px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px calc(96px + env(safe-area-inset-bottom,0px))}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.top .clock{font-family:var(--f-mono);font-size:12px;color:var(--s-dim)}
.skins{display:flex;gap:6px}
.skins button{width:22px;height:22px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0}
.skins button[aria-pressed=true]{border-color:var(--s-fg)}
.page{display:flex;flex-direction:column;gap:14px}
.pnl{background:var(--s-panel);border:1px solid var(--s-border);border-radius:var(--s-r);box-shadow:var(--s-glow);backdrop-filter:blur(10px)}
.pad{padding:14px}
.disp{font-family:var(--s-display);font-weight:var(--s-dw);text-shadow:var(--s-tglow);line-height:1.02;margin:0;text-wrap:balance}
.h1{font-size:38px}.h2{font-size:26px}.h3{font-size:19px}
.eb{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--s-a2)}
.dim{color:var(--s-dim)}
.tnum{font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.app button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.btn{border:1px solid var(--s-border)!important;border-radius:999px!important;padding:7px 14px!important;font-size:12px!important;letter-spacing:.04em}
.btn.solid{background:var(--s-a1)!important;color:var(--s-on)!important;border-color:var(--s-a1)!important;font-weight:600}
.app button:focus-visible,.app input:focus-visible,.app label:focus-within{outline:2px solid var(--s-a2);outline-offset:2px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11px;padding:4px 10px;border-radius:999px;border:1px solid var(--s-border);white-space:nowrap}
.chip.hot{border-color:var(--s-a1);color:var(--s-a1)}
.chk{width:18px;height:18px;flex:none;border:1.5px solid var(--s-a1);border-radius:calc(var(--s-r)/4 + 2px);display:grid;place-items:center}
.on>.chk,.chk.on{background:var(--s-a1);box-shadow:var(--s-glow)}
.on>.chk::after,.chk.on::after{content:"";width:7px;height:3px;border:2px solid var(--s-on);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.list{display:flex;flex-direction:column;gap:8px}
.list>button{display:flex;gap:10px;align-items:center;text-align:left}
.list>button.on span:last-child{opacity:.5;text-decoration:line-through}
.hscroll{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.hscroll::-webkit-scrollbar{display:none}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:8px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;justify-content:center}
.tabs nav{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;width:100%;max-width:448px;padding:6px;background:var(--s-solid);border:1px solid var(--s-border);border-radius:calc(var(--s-r) + 8px);box-shadow:var(--s-glow),0 10px 30px #0008}
.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0;border-radius:var(--s-r);color:var(--s-dim);text-decoration:none;font-size:10px;letter-spacing:.1em;text-transform:uppercase}
.tabs a svg{width:20px;height:20px}
.tabs a[aria-current=page]{color:var(--s-on);background:var(--s-a1);box-shadow:var(--s-glow)}

/* today dial */
.dial svg{width:100%;height:auto;display:block}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* train */
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.days button{display:flex;flex-direction:column;align-items:center;padding:8px 0;border-radius:var(--s-r);border:1px solid var(--s-track)!important;font-size:11px}
.days button small{font-size:8px;letter-spacing:.06em;color:var(--s-dim);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.days button[aria-pressed=true]{border-color:var(--s-a1)!important;box-shadow:var(--s-glow)}
.days button.today{font-weight:700}
.ex{overflow:hidden}
.demo{position:relative;aspect-ratio:16/10;background:radial-gradient(80% 90% at 50% 100%,var(--s-track),transparent),#0005;display:grid;place-items:center;overflow:hidden;border-bottom:1px solid var(--s-border)}
.demo video,.demo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.demo .scan{position:absolute;left:0;right:0;height:40%;background:linear-gradient(transparent,color-mix(in srgb,var(--s-a2) 18%,transparent),transparent);animation:scan 2.6s linear infinite}
@keyframes scan{from{top:-40%}to{top:100%}}
.demo .lbl{position:relative;text-align:center;padding:0 20px;display:flex;flex-direction:column;gap:4px;align-items:center}
.demo .badge{position:absolute;top:10px;left:10px;font-size:9px;letter-spacing:.14em;text-transform:uppercase;padding:3px 7px;border-radius:999px;background:#000a;color:#fff}
.ex .body{padding:14px;display:flex;flex-direction:column;gap:10px}
.sets{display:flex;gap:8px;flex-wrap:wrap}
.sets button{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--s-a1)!important;font-size:12px;font-weight:600}
.sets button.on{background:var(--s-a1);color:var(--s-on);box-shadow:var(--s-glow)}
.sets button:disabled{opacity:.4;cursor:default}
.cues{margin:0;padding-left:16px;font-size:12px;color:var(--s-dim)}
.rest{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:21;display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--s-solid);border:1px solid var(--s-a1);border-radius:999px;box-shadow:var(--s-glow);font-family:var(--f-mono)}

/* fuel */
.meal{display:grid;grid-template-columns:96px 1fr;overflow:hidden}
.meal .ph{position:relative;min-height:120px;background:linear-gradient(160deg,var(--s-track),transparent),#0006;display:grid;place-items:center;overflow:hidden}
.meal .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.meal .ph span{font-family:var(--s-display);font-weight:var(--s-dw);font-size:17px;opacity:.6;text-align:center;padding:0 6px;overflow-wrap:anywhere}
.meal .bd{padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.meal.cur{border-color:var(--s-a1)}
.meal.past{opacity:.55}
.meal ul{margin:0;padding-left:16px;font-size:12px}
.water{display:flex;gap:4px;height:30px;align-items:flex-end}
.water i{flex:1;height:100%;border-radius:4px;background:var(--s-track)}
.water i.f{background:var(--s-a2);box-shadow:var(--s-glow)}

/* progress */
.compare{position:relative;aspect-ratio:3/4;overflow:hidden;border-radius:var(--s-r);border:1px solid var(--s-border);background:#0006;touch-action:pan-y}
.compare img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.compare .after{clip-path:inset(0 0 0 var(--cut,50%))}
.compare .div{position:absolute;top:0;bottom:0;left:var(--cut,50%);width:2px;background:var(--s-a1);box-shadow:var(--s-glow)}
.compare .div::after{content:"⟷";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:34px;height:34px;border-radius:50%;background:var(--s-a1);color:var(--s-on);display:grid;place-items:center;font-size:14px}
.compare input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:ew-resize;margin:0}
.compare .tagl,.compare .tagr{position:absolute;bottom:12px;font-family:var(--s-display);font-weight:var(--s-dw);font-size:22px;color:#fff;text-shadow:0 2px 10px #000}
.compare .tagl{left:14px}.compare .tagr{right:14px}
.strip{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding:14px 12px;background:#000c;border-radius:var(--s-r);position:relative}
.strip::-webkit-scrollbar{display:none}
.strip::before,.strip::after{content:"";position:absolute;left:0;right:0;height:8px;background:repeating-linear-gradient(90deg,transparent 0 8px,#ffffff30 8px 16px)}
.strip::before{top:3px}.strip::after{bottom:3px}
.frame{flex:none;width:118px;display:flex;flex-direction:column;gap:4px;text-align:left}
.frame .ph{aspect-ratio:3/4;border-radius:6px;overflow:hidden;background:linear-gradient(170deg,#ffffff1a,#0000);position:relative;border:1px solid #ffffff26}
.frame .ph img{width:100%;height:100%;object-fit:cover;display:block}
.frame .wk{font-family:var(--f-mono);font-size:10px;color:#fff;letter-spacing:.1em}
.frame .sub{font-size:10px;color:#ffffffa0}
.frame.example{opacity:.5}
.sil{position:absolute;inset:0;display:grid;place-items:center}
.sil svg{width:60%;height:auto;opacity:.5}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats .pnl{padding:10px;text-align:center}
.stats b{display:block;font-family:var(--s-display);font-weight:var(--s-dw);font-size:24px;text-shadow:var(--s-tglow)}
.stats span{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--s-dim)}
.field{display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--s-dim)}
.field input{font:inherit;font-size:14px;color:var(--s-fg);background:#0004;border:1px solid var(--s-border);border-radius:calc(var(--s-r)/2 + 4px);padding:9px 10px;width:100%}
.modal{position:fixed;inset:0;z-index:40;background:#000c;display:flex;align-items:flex-end;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{width:100%;max-width:448px;max-height:100%;overflow-y:auto;background:var(--s-solid);border:1px solid var(--s-border);border-radius:calc(var(--s-r) + 6px);padding:16px;display:flex;flex-direction:column;gap:12px}
.ghostwrap{position:relative;aspect-ratio:3/4;border-radius:var(--s-r);overflow:hidden;background:#0006}
.ghostwrap img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ghostwrap .ghost{opacity:.35;mix-blend-mode:screen}
.toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:50;padding:8px 14px;border-radius:999px;background:var(--s-solid);border:1px solid var(--s-border);font-size:12px}
/* workout mode */
.startbtn{width:100%;padding:16px!important;font-size:14px!important;font-weight:700;border-radius:var(--s-r)!important;background:var(--s-a1)!important;color:var(--s-on)!important;box-shadow:var(--s-glow);letter-spacing:.1em;text-transform:uppercase}
.resume{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-color:var(--s-a1)}
.sess{position:fixed;inset:0;z-index:30;background:var(--s-solid);overflow-y:auto;padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sess .in{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.dots{display:flex;gap:6px}
.dots button{flex:1;height:6px;border-radius:3px;background:var(--s-track)!important}
.dots button.done{background:var(--s-a2)!important}
.dots button.cur{background:var(--s-a1)!important;box-shadow:var(--s-glow)}
.sess-demo{position:relative;aspect-ratio:16/9;border-radius:var(--s-r);overflow:hidden;background:#0006}
.sess-demo video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.coach{padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.coach .tgt{font-family:var(--s-display);font-weight:var(--s-dw);font-size:22px;text-shadow:var(--s-tglow)}
.small{font-size:12px}
.srow{display:grid;grid-template-columns:52px 1fr auto auto;gap:10px;align-items:center;font-size:13px;padding:9px 2px;border-bottom:1px solid var(--s-track)}
.srow.todo{opacity:.5}
.srow.warm{opacity:.6;font-style:italic}
.active{padding:14px;display:flex;flex-direction:column;gap:12px;border-color:var(--s-a1)}
.steppers{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stp{display:grid;grid-template-columns:40px 1fr 40px;align-items:center;border:1px solid var(--s-border);border-radius:calc(var(--s-r)/1.5 + 4px);overflow:hidden}
.stp>button{height:52px;font-size:22px!important}
.stp label{display:flex;flex-direction:column;align-items:center;min-width:0}
.stp input{width:100%;text-align:center;font:inherit;font-size:24px;font-weight:700;background:none;border:0;color:var(--s-fg);padding:0;font-variant-numeric:tabular-nums}
.stp small{font-size:9px;color:var(--s-dim);letter-spacing:.12em;text-transform:uppercase}
.effort{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.effort button{border:1px solid var(--s-border)!important;border-radius:999px!important;padding:8px 0!important;font-size:12px!important;display:flex;flex-direction:column;align-items:center;line-height:1.2}
.effort button small{font-size:9px;color:var(--s-dim)}
.effort button[aria-pressed=true]{background:var(--s-a2)!important;color:var(--s-on)!important}
.effort button[aria-pressed=true] small{color:var(--s-on)}
.restfull{position:fixed;inset:0;z-index:35;background:var(--s-solid);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));text-align:center}
.restfull .ring{position:relative;width:min(68vw,260px);aspect-ratio:1}
.restfull .ring svg{width:100%;height:100%}
.restfull .ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--s-display);font-weight:var(--s-dw);font-size:64px;text-shadow:var(--s-tglow)}
.restfull .row{justify-content:center;flex-wrap:wrap}
.restfull .row .btn{min-width:76px}
.resumebar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:21;display:flex;align-items:center;gap:12px;padding:8px 8px 8px 16px;background:var(--s-solid);border:1px solid var(--s-a1);border-radius:999px;box-shadow:var(--s-glow);font-size:12px;white-space:nowrap}
.bell{position:relative;width:32px;height:32px;display:grid;place-items:center;border:1px solid var(--s-border)!important;border-radius:50%!important;color:var(--s-fg)}
.bell i{position:absolute;top:5px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--s-a1);box-shadow:var(--s-glow)}
.tog{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--s-track);text-align:left;width:100%}
.tog .sw{width:44px;height:26px;border-radius:13px;background:var(--s-track);position:relative;grid-row:span 2;transition:background .2s}
.tog .sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--s-fg);transition:transform .2s}
.tog[aria-pressed=true] .sw{background:var(--s-a1)}
.tog[aria-pressed=true] .sw::after{transform:translateX(18px);background:var(--s-on)}
.restfull{overflow:hidden;background:#000}
.restfull video.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
.restfull .shade{position:absolute;inset:0;z-index:0;background:radial-gradient(circle at 50% 42%,#0000 0 28%,#000b 78%),linear-gradient(#0000 60%,#000d)}
.restfull>:not(video):not(.shade){position:relative;z-index:1}
.restfull .eb,.restfull .small{color:#fff;text-shadow:0 1px 8px #000}
.looks{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;max-width:360px;padding:2px}
.looks::-webkit-scrollbar{display:none}
.looks button{flex:none;font-size:11px!important;padding:5px 10px!important;border-radius:999px!important;border:1px solid #ffffff40!important;color:#fff!important;background:#0006!important}
.looks button[aria-pressed=true]{border-color:var(--s-a1)!important;background:var(--s-a1)!important;color:var(--s-on)!important}
.fire{border-left:3px solid var(--s-a1)}
.lvl{display:flex;gap:4px}

const IDB={db:null,open(){return this.db||(this.db=new Promise((res,rej)=>{const r=indexedDB.open("daily-protocol",1);r.onupgradeneeded=()=>r.result.createObjectStore("progress",{keyPath:"id"});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}))},
  async tx(mode,fn){const db=await this.open();return new Promise((res,rej)=>{const t=db.transaction("progress",mode),out=fn(t.objectStore("progress"));t.oncomplete=()=>res(out&&out.result);t.onerror=()=>rej(t.error)})},
  all(){return this.tx("readonly",s=>s.getAll())},put(v){return this.tx("readwrite",s=>s.put(v))},del(id){return this.tx("readwrite",s=>s.delete(id))}};

  try{const rows=await IDB.all();idbOK=true;
    const legacy=local.get("dp-progress",[]).filter(p=>!rows.some(r=>r.id===p.id));
    S.progress.forEach(p=>{if(p.data&&p.data.startsWith("blob:"))URL.revokeObjectURL(p.data)});
    S.progress=rows.map(r=>({id:r.id,weight:r.weight,note:r.note,takenAt:r.takenAt,data:URL.createObjectURL(r.blob)})).concat(legacy).sort((a,b)=>a.id<b.id?-1:1);
  }catch(e){S.progress=local.get("dp-progress",[])}

}

function coach(ex){
  const m=meta(ex.n),[lo,hi]=repRange(ex.reps),h=histOf(ex.n);
  if(ex.drill)return{w:null,reps:1,lo:1,hi:1,tag:"Speed",why:ex.cues.join(". ")+"."};
  if(ex.power)return{w:null,reps:hi,lo,hi,tag:"Max effort",why:"Every rep as explosive as possible, with full rest. End the set early if height or distance drops."};
  if(ex.bw){const last=h[h.length-1],all=last&&last.sets.length&&last.sets.every(x=>x.r>=hi);
    return{w:null,reps:all?hi+2:hi,lo,hi,tag:all?"+2 reps":"Bodyweight",up:all,why:all?`You hit ${hi} on every set. Aim for ${hi+2}, or slow down the lowering.`:`Clean reps, ${hi} on every set.`}}
  if(!h.length)return{w:null,reps:hi,lo,hi,tag:"Calibrate",why:`First time logging this. Pick a weight you could lift about ${hi+2} times, then stop at ${hi}. Your next targets come from what you log.`};
  const {w,top}=topSets(h[h.length-1].sets);
  const allTop=top.length>=Math.min(ex.sets,2)&&top.every(x=>x.r>=hi);
  const hard=top.some(x=>x.e==="hard"),easy=top.every(x=>x.e==="easy"),miss=top.filter(x=>x.r<lo).length;
  let stalls=0;for(let i=h.length-1;i>=0;i--){const t=topSets(h[i].sets);if(t.w!==w||t.top.every(x=>x.r>=hi))break;stalls++}
  if(allTop&&easy&&top[0].r>=hi+2)return{w:w+2*m.inc,reps:lo,lo,hi,tag:`+${2*m.inc} lb`,up:true,why:`Every set felt easy and went past ${hi} reps, so this jumps two steps.`};
  if(allTop&&!hard)return{w:w+m.inc,reps:lo,lo,hi,tag:`+${m.inc} lb`,up:true,why:`You hit ${hi} reps on every set last time. Up ${m.inc} lb; aim for ${lo} or more.`};
  if(allTop)return{w,reps:hi,lo,hi,tag:"Hold",why:`Top of the range, but it felt hard. Same weight until it feels good, then it goes up.`};
  if(miss>=2&&stalls>=3)return{w:roundTo(w*.9,m.inc),reps:hi,lo,hi,tag:"Reset −10%",down:true,why:`Stuck at ${w} lb for ${stalls} sessions. Drop 10% and build back with clean reps.`};
  if(miss>=2)return{w,reps:lo,lo,hi,tag:"Hold",why:`Under ${lo} reps on ${miss} sets. Same weight; get ${lo} on every set first.`};
  const tot=top.reduce((a,x)=>a+x.r,0);
  return{w,reps:Math.min(hi,Math.max(...top.map(x=>x.r))+1),lo,hi,tag:"Add reps",why:`In range last time (${top.map(x=>x.r).join(", ")}). Same weight; beat ${tot} total reps.`};
}
function warmups(ex,w){const m=meta(ex.n);if(!m.compound||!w||w<30)return[];return[[.5,8],[.75,4]].map(([p,r])=>({w:roundTo(w*p,m.inc),r}))}
function spark(vals,w=96,h=28){
  if(vals.length<2)return"";const mn=Math.min(...vals),mx=Math.max(...vals),sp=mx-mn||1;
  const pts=vals.map((v,i)=>[2+i*(w-4)/(vals.length-1),h-3-(v-mn)/sp*(h-6)]);
  const [ex,ey]=pts[pts.length-1];
  return`<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><polyline points="${pts.map(p=>p.map(n=>n.toFixed(1)).join(",")).join(" ")}" fill="none" stroke="var(--s-a2)" stroke-width="2" stroke-linejoin="round"/><circle cx="${ex.toFixed(1)}" cy="${ey.toFixed(1)}" r="3" fill="var(--s-a1)"/></svg>`;
}

let AC=null,WL=null;
function unlockAudio(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state!=="running")AC.resume()}catch(e){}}
function beep(){
  try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}
  if(!AC)return;const t0=AC.currentTime;
  [0,.28,.56].forEach((t,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=i===2?1320:880;
    g.gain.setValueAtTime(.0001,t0+t);g.gain.exponentialRampToValueAtTime(.35,t0+t+.02);g.gain.exponentialRampToValueAtTime(.0001,t0+t+.2);
    o.connect(g);g.connect(AC.destination);o.start(t0+t);o.stop(t0+t+.22)});
}
async function wake(on){try{if(on&&!WL&&navigator.wakeLock){WL=await navigator.wakeLock.request("screen");WL.addEventListener("release",()=>{WL=null})}if(!on&&WL){await WL.release();WL=null}}catch(e){}}
const clock=ms=>{const s=Math.max(0,Math.floor(ms/1000)),h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return(h?h+":"+String(m).padStart(2,"0"):m)+":"+String(x).padStart(2,"0")};

function sessDraft(ex){
  const log=SESS.log[ex.n],c=coach(ex);
  if(!SESS.draft||SESS.draft.ex!==ex.n)SESS.draft={ex:ex.n,w:ex.bw||ex.drill?0:log.length?log[log.length-1].w:(c.w??""),r:log.length?log[log.length-1].r:c.reps,e:"good"};

function logSet(){
  const W=WEEK[SESS.day],ex=W.lift[SESS.i],d=sessDraft(ex),m=meta(ex.n),c=coach(ex);
  const free=ex.bw||ex.drill,w=free?0:parseFloat(d.w),r=ex.drill?1:parseInt(d.r,10);
  if(!free&&!(w>0)){toast("Enter the weight first.");return}
  if(!(r>0)){toast("Enter how many reps you did.");return}
  const log=SESS.log[ex.n];log.push({w,r,e:d.e});
  if(SESS.day===DAYS[new Date().getDay()]){const doc=dayDoc(today());doc.sets[`${SESS.i}|${log.length-1}`]=true;saveDay(today())}
  SESS.draft={ex:ex.n,w,r:c.reps,e:"good"};
  let next;
  const word=ex.drill?"Rep":"Set";
  if(log.length<ex.sets)next=`${word} ${log.length+1} of ${ex.sets} · ${ex.drill?ex.dist:free?rangeLabel(c.lo,c.reps)+" reps":wlabel(ex.n,w)+" × "+rangeLabel(c.lo,c.hi)}`;
  else if(SESS.i<W.lift.length-1){SESS.i++;SESS.draft=null;const nx=W.lift[SESS.i],nc=coach(nx);next=`Next: ${nx.n} · ${targetText(nx,nc)}`}

function clearTodaySets(match){ // remove the Today/stats set marks this session wrote
  if(!SESS||SESS.day!==DAYS[new Date().getDay()])return;

function removeSavedToday(day){
  const d=today();WEEK[day].lift.forEach(x=>{if(LIFTS[x.n]){LIFTS[x.n]=LIFTS[x.n].filter(s=>s.d!==d);if(!LIFTS[x.n].length)delete LIFTS[x.n]}});saveLifts();
  if(day===DAYS[new Date().getDay()]){const doc=dayDoc(d);doc.sets={};saveDay(d)}
}
function finishWorkout(){
  const W=WEEK[SESS.day],dur=Date.now()-SESS.start,d=today();let vol=0,sets=0;const prs=[];
  W.lift.forEach(ex=>{const log=SESS.log[ex.n];if(!log||!log.length)return;
    const prev=histOf(ex.n).reduce((b,s)=>Math.max(b,bestOf(s.sets)),0),now=bestOf(log);
    (LIFTS[ex.n]=LIFTS[ex.n]||[]).push({d,t:Date.now(),sets:log});
    log.forEach(x=>{vol+=x.w*x.r*(meta(ex.n).each?2:1);sets++});
    if(prev&&now>prev+.5)prs.push({n:ex.n,e:Math.round(now),gain:Math.round(now-prev)})});
  saveLifts();
  const next=W.lift.filter(ex=>!ex.drill&&histOf(ex.n).length).map(ex=>({n:ex.n,c:coach(ex),ex}));
  S.summary={w:W.w,dur,vol:Math.round(vol),sets,prs,next};
  if(SESS.rest)pushRest(null);
  SESS=null;saveSess();S.inSession=false;S.finishAsk=false;wake(false);render();
}

const standalone=()=>matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;

async function api(path,body){
  const r=await fetch(PUSH_URL+path,body?{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}:{});
  const j=await r.json().catch(()=>({}));

const keyBytes=k=>Uint8Array.from(atob(k.replace(/-/g,"+").replace(/_/g,"/")+"===".slice((k.length+3)%4)),c=>c.charCodeAt(0));

    const reg=await navigator.serviceWorker.ready,{publicKey}=await api("/key");

    const r=await api("/subscribe",{sub:sub.toJSON(),tz:tzName(),reminders:buildReminders()});

  const frames=P.length?P.map((p,i)=>{const s=weekStats(p.id);return`<button class="frame" data-view="${i}"><div class="ph"><img src="${photoSrc(p)}" alt="Week ${i+1}" loading="lazy"></div><span class="wk">WK ${String(i+1).padStart(2,"0")} · ${new Date(p.id+"T00:00:00").toLocaleDateString(undefined,{month:"short",day:"numeric"})}</span><span class="sub">${p.weight?esc(p.weight)+" lb · ":""}${s.lifts} lifts</span></button>`}).join("")
   :[1,2,3,4].map(i=>`<div class="frame example"><div class="ph"><div class="sil">${SIL}</div></div><span class="wk">WK 0${i}</span><span class="sub">Example frame</span></div>`).join("");
  return`<div class="between"><div><div class="eb">Weekly check-in · ${S.store==="cloud"?"saved privately":"saved on this device"}</div><h1 class="disp h1">Progress</h1></div><span class="chip ${isSun&&!has?"hot":""}">${has?"✓ This week done":isSun?"Due today":"Due Sun · "+daysLeft+"d"}</span></div>
  ${hero}
  <div class="stats"><div class="pnl"><b class="tnum">${stats.lifts}</b><span>Training days</span></div><div class="pnl"><b class="tnum">${stats.meals}</b><span>Meals logged</span></div><div class="pnl"><b class="tnum">${stats.pins}</b><span>Gluta pins</span></div></div>
  ${liftsSection()}
  <div class="eb">The reel</div>
  <div class="strip">${frames}</div>
  <label class="btn solid" style="text-align:center;cursor:pointer;display:block">${has?"Replace this week's photo":"Add week "+(P.length+1)+" photo"}<input type="file" accept="image/*" data-file hidden></label>
  ${S.store==="local"?'<span class="dim" style="font-size:11px">Photos stay on this device only.</span>':""}`;
}

function liftsSection(){
  const names=Object.keys(LIFTS).filter(n=>LIFTS[n].length&&LIFTS[n].some(s=>s.sets.some(x=>x.w>0)));
  if(!names.length)return`<section class="pnl pad"><div class="eb">Lifts</div><p class="dim small" style="margin:6px 0 0">Tap Start on the Train tab and log your sets. Each lift's estimated max, best set and trend show up here, and the coach adjusts your weights from them.</p></section>`;
  const rows=names.map(n=>{const h=LIFTS[n],vals=h.map(s=>Math.round(bestOf(s.sets))),cur=vals[vals.length-1],first=vals[0],best=h.flatMap(s=>s.sets).reduce((b,x)=>e1rm(x.w,x.r)>e1rm(b.w,b.r)?x:b,{w:0,r:0});
    return`<div class="lift"><span><b>${esc(n)}</b><span class="dim small" style="display:block">Best set ${best.w} × ${best.r} · ${h.length} session${h.length>1?"s":""}</span></span><span style="text-align:right"><b class="tnum">${cur} lb</b>${cur>first?` <span class="pr small">+${cur-first}</span>`:""}<span style="display:block">${spark(vals)}</span></span></div>`}).join("");
  return`<section class="pnl pad"><div class="between"><span class="eb">Lifts · estimated 1-rep max</span></div>${rows}</section>`;
}

/* ---- upload flow ---- */
function downscale(file,max){return new Promise((res,rej)=>{const img=new Image(),u=URL.createObjectURL(file);img.onload=()=>{const k=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?res({blob:b,url:c.toDataURL("image/jpeg",.72)}):rej(),"image/jpeg",.85)};img.onerror=rej;img.src=u})}
function sheetUpload(){
  const u=S.upload,prev=S.progress.filter(p=>p.id!==u.wk).slice(-1)[0];
  return`<div class="modal" data-close><div class="sheet" role="dialog" aria-label="Weekly photo">
   <div class="between"><h2 class="disp h2">Week ${u.n} check-in</h2><button class="btn" data-close>Cancel</button></div>
   <div class="ghostwrap"><img src="${u.url}" alt="New photo">${prev&&u.ghost?`<img class="ghost" src="${photoSrc(prev)}" alt="">`:""}</div>
   ${prev?`<button class="btn" data-ghost>${u.ghost?"Hide":"Show"} last week's ghost to line up your pose</button>`:""}
   <label class="field" for="wt">Weight (optional)<input id="wt" inputmode="decimal" placeholder="e.g. 182.4" value="${esc(u.weight||"")}"></label>
   <label class="field" for="nt">Note (optional)<input id="nt" placeholder="How the week felt" value="${esc(u.note||"")}"></label>
   <button class="btn solid" data-save ${u.busy?"disabled":""}>${u.busy?"Saving…":"Save to the reel"}</button></div></div>`;
}
function sheetView(){
  const i=S.view.i,p=S.progress[i];if(!p)return"";const s=weekStats(p.id);
  return`<div class="modal" data-close><div class="sheet" role="dialog" aria-label="Week ${i+1}">
   <div class="between"><h2 class="disp h2">Week ${i+1}</h2><button class="btn" data-close>Close</button></div>
   <div class="ghostwrap"><img src="${photoSrc(p)}" alt="Week ${i+1}"></div>
   <div class="dim">${new Date(p.id+"T00:00:00").toLocaleDateString(undefined,{weekday:"short",month:"long",day:"numeric"})}${p.weight?" · "+esc(p.weight)+" lb":""}</div>
   ${p.note?`<div>${esc(p.note)}</div>`:""}
   <div class="stats"><div class="pnl"><b>${s.lifts}</b><span>Training days</span></div><div class="pnl"><b>${s.meals}</b><span>Meals</span></div><div class="pnl"><b>${s.pins}</b><span>Pins</span></div></div>
   ${S.view.confirm?`<div class="row"><span class="dim" style="flex:1">Delete this week's photo for good?</span><button class="btn" data-del-no>Keep</button><button class="btn solid" data-del-yes>Delete</button></div>`:`<button class="btn" data-del>Delete photo</button>`}</div></div>`;
}
async function saveUpload(){
  const u=S.upload;u.weight=$("#wt")?.value.trim();u.note=$("#nt")?.value.trim();u.busy=true;render();
  const rec={weight:u.weight||"",note:u.note||"",takenAt:new Date().toISOString()};
  try{
    if(DB&&ASSETS){const old=S.progress.find(p=>p.id===u.wk);const r=await ASSETS.upload(u.blob,{type:"image/jpeg"});rec.photo=r.id;await DB.doc(`${BASE}/progress/${u.wk}`).set(rec);if(old&&old.photo&&old.photo!==r.id){try{await ASSETS.delete(old.photo)}catch(e){}}}
    else if(idbOK){await IDB.put({id:u.wk,...rec,blob:u.blob});local.set("dp-progress",local.get("dp-progress",[]).filter(p=>p.id!==u.wk));await loadLocalProgress()}
    else{rec.data=u.url;S.progress=S.progress.filter(p=>p.id!==u.wk).concat([{id:u.wk,...rec}]).sort((a,b)=>a.id<b.id?-1:1);if(!local.set("dp-progress",S.progress))toast("Saved for now, but this browser is out of room.")}
    S.upload=null;toast("Added to the reel");
  }catch(e){u.busy=false;toast(e&&e.code==="too_large"?"That photo is too large. Try another.":"Couldn't save the photo. Try again.")}
  render();
}
async function deleteView(){
  const p=S.progress[S.view.i];if(!p)return;
  try{if(DB){await DB.doc(`${BASE}/progress/${p.id}`).delete();if(ASSETS&&p.photo){try{await ASSETS.delete(p.photo)}catch(e){}}}
    else{if(idbOK)await IDB.del(p.id);local.set("dp-progress",local.get("dp-progress",[]).filter(x=>x.id!==p.id));if(idbOK)await loadLocalProgress();else S.progress=S.progress.filter(x=>x.id!==p.id)}
    S.view=null;toast("Photo deleted")}catch(e){toast("Couldn't delete. Try again.")}
  render();
}

/* ======================= SHELL ======================= */
const PAGES={today:["Today",pageToday,'<circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 7v5l3 2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>'],
  train:["Train",pageTrain,'<path d="M3 10v4M6 7v10M18 7v10M21 10v4M6 12h12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>'],
  fuel:["Fuel",pageFuel,'<path d="M5 3v8a3 3 0 0 0 6 0V3M8 3v18M16 21V3c2.5 1 4 4 4 8h-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>'],
  progress:["Progress",pageProgress,'<rect x="3" y="5" width="18" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="3.5" fill="none" stroke="currentColor" stroke-width="2"/>']};
const route=()=>{const h=location.hash.slice(1);return PAGES[h]?h:"today"};
const SKINS={gridiron:"linear-gradient(135deg,#1d3b29 50%,#f2b632 50%)",neon:"#ff4fd8",quest:"#4fb3ff",chrome:"linear-gradient(135deg,#b8c6ff,#ffb8e8)",solar:"linear-gradient(#2f7fd8,#ffb36b)"};
const SKY=[[0,["#070b24","#141a46","#2a2a5e"]],[390,["#1b1d4f","#6a4a8c","#f08a5d"]],[480,["#5aa0e6","#f6c28b","#ffb36b"]],[720,["#2f7fd8","#7fbef0","#cfe8f7"]],[1020,["#3a5ba8","#e08a6b","#f7b267"]],[1140,["#22205a","#7a3f84","#e0626b"]],[1260,["#0b1035","#1e2366","#3d2f73"]],[1440,["#070b24","#141a46","#2a2a5e"]]];
const hx=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const mix=(a,b,t)=>"#"+hx(a).map((v,i)=>Math.round(v+(hx(b)[i]-v)*t).toString(16).padStart(2,"0")).join("");
function skyAt(m){for(let i=0;i<SKY.length-1;i++){const[a,ca]=SKY[i],[b,cb]=SKY[i+1];if(m>=a&&m<=b){const t=(m-a)/(b-a);return ca.map((c,j)=>mix(c,cb[j],t))}}return SKY[0][1]}

function render(){
  const app=$("#app"),r=route();
  app.className="app skin-"+S.skin;
  app.style.background=S.skin==="solar"?(()=>{const s=skyAt(nowMin());return`linear-gradient(180deg,${s[0]} 0%,${s[1]} 55%,${s[2]} 100%) fixed`})():"";
  $("#clock").textContent=new Date().toLocaleTimeString([],{hour:"numeric",minute:"2-digit"});
  const dot=$("#bellDot");if(dot)dot.hidden=!PUSH.on;
  $("#skins").innerHTML=Object.entries(SKINS).map(([k,c])=>`<button data-skin="${k}" aria-pressed="${k===S.skin}" aria-label="${k} skin" style="background:${c}"></button>`).join("");
  $("#tabs").innerHTML=Object.entries(PAGES).map(([k,[n,,ic]])=>`<a href="#${k}" ${k===r?'aria-current="page"':""}><svg viewBox="0 0 24 24">${ic}</svg>${n}</a>`).join("");
  const keepFocus=document.activeElement&&document.activeElement.id;
  $("#page").innerHTML=PAGES[r][1]();
  $("#overlay").innerHTML=(SESS&&S.inSession?renderSession():"")+(SESS&&!S.inSession&&!S.summary?`<div class="resumebar" role="status"><span>${esc(WEEK[SESS.day].w)} · <b class="tnum" id="sessMini">${clock(Date.now()-SESS.start)}</b></span><button class="btn solid" data-resume>Resume</button></div>`:"")+(S.summary?sheetSummary():"")+(S.remind?sheetRemind():"")+(S.upload?sheetUpload():"")+(S.view?sheetView():"")+(S.rest?`<div class="rest" role="status"><span>Rest</span><b class="tnum" id="restT">${Math.max(0,Math.ceil((S.rest-Date.now())/1000))}s</b><button class="btn" data-rest-x>Skip</button></div>`:"");
  if(keepFocus&&document.getElementById(keepFocus))document.getElementById(keepFocus).focus();
}

/* ======================= EVENTS ======================= */
document.addEventListener("click",e=>{
  const t=e.target.closest("button,[data-close]");if(!t)return;const d=t.dataset,doc=dayDoc(today()),k=today();
  if(SESS&&S.inSession)unlockAudio();
  if(d.start){startWorkout(d.start);return}
  if("resume" in d){S.inSession=true;unlockAudio();wake(true);render();return}
  if(SESS){
    readInputs();
    const ex=WEEK[SESS.day].lift[SESS.i];
    if("minimize" in d){S.inSession=false;S.finishAsk=false;saveSess();render();return}
    if(d.goex!=null){const j=+d.goex,n=WEEK[SESS.day].lift.length;if(j>=n){S.finishAsk=true}else if(j>=0){SESS.i=j;SESS.draft=null;S.finishAsk=false}saveSess();render();return}
    if(d.dw){const dr=sessDraft(ex);dr.w=Math.max(0,(parseFloat(dr.w)||0)+(+d.dw)*meta(ex.n).inc);saveSess();render();return}
    if(d.dr){const dr=sessDraft(ex);dr.r=Math.max(0,(parseInt(dr.r,10)||0)+(+d.dr));saveSess();render();return}
    if(d.eff){sessDraft(ex).e=d.eff;saveSess();render();return}
    if("logset" in d){logSet();return}
    if("undo" in d){const log=SESS.log[ex.n];const x=log.pop();if(x){SESS.draft={ex:ex.n,w:x.w,r:x.r,e:x.e};const doc=dayDoc(today());delete doc.sets[`${SESS.i}|${log.length}`];saveDay(today())}if(SESS.rest)pushRest(null);SESS.rest=null;saveSess();render();return}
    if(d.restadd){if(SESS.rest){SESS.rest.end=Math.max(Date.now()+1000,SESS.rest.end+(+d.restadd)*1000);SESS.rest.total=Math.max(SESS.rest.total,SESS.rest.end-Date.now());pushRest(SESS.rest.end,SESS.rest.next)}saveSess();render();return}
    if(d.look){local.set("dp-look",d.look);render();return}
    if("restskip" in d){if(SESS.rest)pushRest(null);SESS.rest=null;saveSess();render();return}
    if("finish" in d){askBar(true);return}
    if("finishno" in d){S.finishAsk=false;render();return}
    if("resetask" in d){askBar("reset");return}
    if("discardask" in d){askBar("discard");return}
    if("resetexask" in d){askBar("resetex");return}
    if("doreset" in d){if(SESS.rest)pushRest(null);clearTodaySets(()=>true);Object.keys(SESS.log).forEach(k=>{SESS.log[k]=[]});Object.assign(SESS,{start:Date.now(),i:0,draft:null,rest:null});S.finishAsk=false;saveSess();toast("Workout reset.");render();return}
    if("dodiscard" in d){if(SESS.rest)pushRest(null);clearTodaySets(()=>true);SESS=null;saveSess();S.inSession=false;S.finishAsk=false;wake(false);toast("Workout discarded.");render();return}
    if("doresetex" in d){if(SESS.rest)pushRest(null);const i=SESS.i;clearTodaySets(k=>k.startsWith(i+"|"));SESS.log[ex.n]=[];SESS.draft=null;SESS.rest=null;S.finishAsk=false;saveSess();toast("Exercise reset.");render();return}
    if("finishyes" in d){finishWorkout();return}
  }
  if("sumclose" in d&&(e.target===t||t.tagName==="BUTTON")){S.summary=null;render();return}
  if(d.removeask){S.trainAsk=d.removeask;render();return}
  if("trainno" in d){S.trainAsk=null;render();return}
  if(d.removetoday){removeSavedToday(d.removetoday);S.trainAsk=null;toast("Today's workout removed.");render();return}
  if("remind" in d){S.remind=true;render();return}
  if("remindclose" in d&&(e.target===t||t.tagName==="BUTTON")){S.remind=false;render();return}
  if(d.rg){PUSH.groups[d.rg]=!PUSH.groups[d.rg];savePush();syncPush();render();return}
  if("pushon" in d){enablePush();return}
  if("pushoff" in d){disablePush();return}
  if("pushtest" in d){api("/test",{id:PUSH.id,secret:PUSH.secret}).then(()=>toast("Test sent.")).catch(()=>toast("Couldn't reach the reminder server."));return}
  if(d.skin){S.skin=d.skin;local.set("dp-skin",S.skin);render();return}
  if(d.ck){doc.checks[d.ck]=!doc.checks[d.ck];saveDay(k);render();return}
  if(d.tday){S.trainDay=d.tday;render();return}
  if(d.set){const was=doc.sets[d.set];doc.sets[d.set]=!was;if(!was){doc.sets[d.set]=true;S.rest=Date.now()+90000}else delete doc.sets[d.set];saveDay(k);render();return}
  if("restX" in d){S.rest=null;render();return}
  if(d.meal){doc.meals[d.meal]=!doc.meals[d.meal];saveDay(k);render();return}
  if("water" in d){doc.water=((doc.water||0)+1)%9;saveDay(k);render();return}
  if(d.view!=null){S.view={i:+d.view};render();return}
  if("ghost" in d){S.upload.ghost=!S.upload.ghost;S.upload.weight=$("#wt").value;S.upload.note=$("#nt").value;render();return}
  if("save" in d){saveUpload();return}
  if("del" in d){S.view.confirm=true;render();return}
  if("delNo" in d){S.view.confirm=false;render();return}
  if("delYes" in d){deleteView();return}
  if("close" in d&&(e.target===t||t.tagName==="BUTTON")){if(S.upload&&S.upload.busy)return;S.upload=null;S.view=null;render()}
});
document.addEventListener("input",e=>{if((e.target.id==="inW"||e.target.id==="inR")&&SESS){readInputs();saveSess();return}if(e.target.dataset.cut!=null){S.cut=+e.target.value;e.target.closest(".compare").style.setProperty("--cut",S.cut+"%")}});
document.addEventListener("change",async e=>{
  if(e.target.dataset.file==null||!e.target.files[0])return;
  try{const {blob,url}=await downscale(e.target.files[0],1280),wk=dkey(weekStart(new Date())),idx=S.progress.findIndex(p=>p.id===wk);
    S.upload={blob,url,wk,n:idx>=0?idx+1:S.progress.length+1,ghost:true};render()}catch(err){toast("That file couldn't be read as a photo.")}
});
addEventListener("hashchange",()=>{scrollTo(0,0);render()});
setInterval(()=>{if(S.rest){const left=S.rest-Date.now();if(left<=0){S.rest=null;toast("Rest done. Next set.");render()}else{const el=$("#restT");if(el)el.textContent=Math.ceil(left/1000)+"s"}}},500);
setInterval(()=>{if(!S.upload&&!S.view&&!S.summary&&!S.remind&&!(SESS&&S.inSession)&&document.activeElement.tagName!=="INPUT")render()},30000);
setInterval(()=>{
  if(!SESS)return;
  const t=$("#sessT");if(t)t.textContent=clock(Date.now()-SESS.start);
  const mini=$("#sessMini");if(mini)mini.textContent=clock(Date.now()-SESS.start);
  if(SESS.rest){const left=SESS.rest.end-Date.now();
    if(left<=0){SESS.rest=null;saveSess();if(S.inSession){beep();toast("Rest's up. Next set.")}render();return}
    const b=$("#restBig");if(b)b.textContent=clock(left+999);
    const ring=$("#restRing");if(ring)ring.style.strokeDashoffset=String(326.7*(1-left/SESS.rest.total));}
},250);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&SESS&&S.inSession){wake(true);render()}});

/* ======================= FX ======================= */
(()=>{const cv=$("#fx"),ctx=cv.getContext("2d");let W,H,p=[],skin=null;
  const FX={neon:{n:90,i:()=>({x:Math.random()*W,y:Math.random()*H,l:8+Math.random()*22,v:6+Math.random()*10}),d:()=>{ctx.strokeStyle="rgba(160,220,255,.18)";ctx.lineWidth=1;ctx.beginPath();p.forEach(o=>{ctx.moveTo(o.x,o.y);ctx.lineTo(o.x-2,o.y+o.l);o.y+=o.v;o.x-=.6;if(o.y>H){o.y=-o.l;o.x=Math.random()*W*1.1}});ctx.stroke()}},
    quest:{n:50,i:()=>({x:Math.random()*W,y:Math.random()*H,r:.6+Math.random()*2,v:.3+Math.random()*1.2,a:Math.random()*6}),d:()=>p.forEach(o=>{o.y-=o.v;o.a+=.02;if(o.y<0){o.y=H;o.x=Math.random()*W}ctx.fillStyle=`rgba(90,180,255,${.25+.25*Math.sin(o.a)})`;ctx.beginPath();ctx.arc(o.x,o.y,o.r,0,7);ctx.fill()})},
    solar:{n:50,i:()=>({x:Math.random()*W,y:Math.random()*H*.4,r:.5+Math.random()*1.3,a:Math.random()*6}),d:()=>{const m=nowMin(),o=m>=1140||m<420?1:m>=1080?(m-1080)/60:m<480?(480-m)/60:0;if(o<=0)return;p.forEach(s=>{s.a+=.03;ctx.fillStyle=`rgba(255,255,255,${o*(.3+.5*Math.abs(Math.sin(s.a)))})`;ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,7);ctx.fill()})}}};
  const rs=()=>{const d=Math.min(2,devicePixelRatio||1);W=cv.width=innerWidth*d;H=cv.height=innerHeight*d;skin=null};rs();addEventListener("resize",rs);
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  (function loop(){const f=FX[S.skin];if(skin!==S.skin){skin=S.skin;p=f?Array.from({length:f.n},f.i):[]}ctx.clearRect(0,0,W,H);if(f)f.d();if(!reduce)requestAnimationFrame(loop)})();
})();

if(SESS)S.inSession=true; // reopen an unfinished workout where it left off
initStore();
checkPush();
</script>
<script>
if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
